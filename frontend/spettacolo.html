<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spettacolo · Teatro Garibaldi</title>
  <link rel="stylesheet" href="vendor/bootstrap-italia/css/bootstrap-italia.min.css">
  <link rel="stylesheet" href="vendor/design-tokens-italia/variables.css">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="principale" class="container my-5">
    <nav aria-label="Percorso di navigazione" class="breadcrumb-container">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">Cartellone</a><span class="separator">/</span></li>
        <li class="breadcrumb-item active" aria-current="page" id="briciola">Spettacolo</li>
      </ol>
    </nav>
    <div id="messaggi"></div>
    <div class="row g-3 g-lg-5" id="contenuto" hidden>
      <div class="col-lg-7">
        <span class="badge bg-primary mb-2" id="genere"></span>
        <h1 id="titolo"></h1>
        <p class="lead" id="sottotitolo"></p>
        <p id="descrizione"></p>
        <p class="text-secondary" id="durata"></p>

        <section class="mt-5" aria-labelledby="titolo-recensioni">
          <h2 class="h4" id="titolo-recensioni">Recensioni del pubblico</h2>
          <div id="riepilogo-voti" class="text-secondary mb-3"></div>
          <div id="form-feedback-wrap"></div>
          <div id="recensioni"></div>
        </section>
      </div>

      <div class="col-lg-5">
        <aside class="card shadow rounded pannello-prenota" aria-labelledby="titolo-prenota">
          <div class="card-body p-4">
            <h2 class="h4" id="titolo-prenota">Prenota</h2>
            <h3 class="h6 mt-4">1. Scegli la data</h3>
            <ul class="elenco-repliche" id="repliche"></ul>
            <form id="form-prenota" class="mt-4" hidden>
              <fieldset>
                <legend class="h6">2. Scegli il settore</legend>
                <div id="settori"></div>
              </fieldset>
              <div class="row mt-4">
                <div class="col-sm-5">
                  <div class="select-wrapper">
                    <label for="num-posti">3. Posti</label>
                    <select id="num-posti"></select>
                  </div>
                </div>
                <div class="col-sm-7">
                  <div class="select-wrapper">
                    <label for="tariffa">4. Tariffa</label>
                    <select id="tariffa"></select>
                  </div>
                </div>
              </div>
              <p class="small text-secondary mt-2 mb-0" id="nota-tariffa" hidden></p>
              <div class="totale mt-3"><span>Totale</span><span id="totale">0,00 €</span></div>
              <button type="submit" class="btn btn-primary w-100" id="conferma">Conferma prenotazione</button>
              <p class="small text-secondary mt-3 mb-0">Pagamento in biglietteria. Massimo 6 posti per persona e per replica.
                Annullamento gratuito fino a 24 ore prima.</p>
            </form>
            <div id="esito"></div>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <script src="vendor/bootstrap-italia/js/bootstrap-italia.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pagine/spettacolo.js"></script>
</body>
</html>
